#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw

write_files:
  - path: /opt/bran-qdrant/compose.yaml
    permissions: "0644"
    content: |
      services:
        qdrant:
          image: qdrant/qdrant:v1.19.1
          container_name: bran-qdrant
          restart: unless-stopped
          env_file:
            - /etc/bran-qdrant.env
          ports:
            - "6333:6333"
          volumes:
            - /mnt/bran-qdrant/storage:/qdrant/storage
          healthcheck:
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

runcmd:
  - mkdir -p /opt/bran-qdrant /mnt/bran-qdrant/storage
  - [bash, -lc, "until test -e /dev/disk/by-id/scsi-0DO_Volume_bran-qdrant-data; do sleep 2; done"]
  - [bash, -lc, "blkid /dev/disk/by-id/scsi-0DO_Volume_bran-qdrant-data || mkfs.ext4 -F /dev/disk/by-id/scsi-0DO_Volume_bran-qdrant-data"]
  - [bash, -lc, "grep -q bran-qdrant-data /etc/fstab || echo '/dev/disk/by-id/scsi-0DO_Volume_bran-qdrant-data /mnt/bran-qdrant ext4 defaults,nofail,discard 0 2' >> /etc/fstab"]
  - mount -a
  - chown -R 1000:1000 /mnt/bran-qdrant
  - [bash, -lc, "umask 077; printf 'QDRANT__SERVICE__API_KEY=%s\n' \"$(openssl rand -hex 32)\" > /etc/bran-qdrant.env"]
  - systemctl enable --now docker
  - [bash, -lc, "cd /opt/bran-qdrant && docker compose up -d"]
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - [bash, -lc, "ufw allow from 10.124.0.0/20 to any port 6333 proto tcp"]
  - ufw --force enable
